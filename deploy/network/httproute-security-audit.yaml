apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: security-audit-route
  namespace: hse-llm-project
  labels:
    app.kubernetes.io/part-of: security-audit-service
spec:
  parentRefs:
    - name: web-gateway
      namespace: hse-llm-project
  hostnames:
    - audit.hse-llm.internal
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: security-audit-service
          port: 8000
